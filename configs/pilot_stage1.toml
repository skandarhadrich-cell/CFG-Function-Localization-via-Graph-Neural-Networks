# Stage 1 configuration: three-target function localisation.
# Corpus: the v2 clean set (x86 PE, ~2,700 samples) in three source buckets.
# Labels: anti_debug, keylogger, injection (CAPA namespace matches).

[paths]
manifest = "data/versions/v2/manifest.csv"
splits = "data/versions/v2/splits"
split_file = "data/versions/v2/splits/three_target.json"
labels_raw = "data/labels/capa_raw"
labels_table = "data/labels/stage1_full_three_targets.parquet"
mapping = "results/full/mapping_three_target.jsonl"
graphs = "data/graphs_v2"
processed = "data/processed_v2"
corpus = "results/corpus_v2_three_targets"
train = "results/train/stage1"
results = "results"

[tools]
capa = "~/tools/capa/capa"
capa_rules = "~/tools/capa-rules"
capa_version = "9.1.0"
capa_rules_commit = "805f9eaccfb6a4e1ddffc809d71d1e2b5ccc15e5"
capa_rules_dirty = false

[labels]
# Namespaces are prefixes; static function and basic-block scopes only.
anti_debug_namespaces = ["anti-analysis/anti-debugging"]
keylogger_namespaces = ["collection/keylog"]
injection_namespaces = [
  "host-interaction/process/inject",
  "load-code/pe/inject-",
]

[labels.contract]
version = "stage1-three-target-v1"
name = "three-target-function-localization"
active_labels = ["anti_debug", "keylogger", "injection"]
outputs = 3
loss = "BCEWithLogitsLoss"
observed_inventory = "meta.analysis.feature_counts.functions"
use_rule_scopes = "meta.scopes.static"
weak_negative = "observed function with no active-label target rule match"
function_scope_localization = "capa nested evidence locations; fallback to capa function start"
unlabeled = "angr function not mapped to CAPA observed inventory"
min_positive_functions_full_set = 300
counting_unit = "functions_with_positive_label"
zero_rule_policy = "exclude_from_loss_not_negative"

[labels.stage2]
# Block labels are seeded from CAPA basic-block matches and from API-call
# blocks inside positive functions.  The API-call part uses the PE import
# table, not CAPA rule names.
enabled = true
label_source = "capa basic-block matches + import-resolved API-call blocks"
targets = ["anti_debug", "keylogger", "injection"]

[evaluation.diversity]
# Pre-registered claim diagnostics; frozen before model performance is seen.
min_positive_functions = 300
min_positive_binaries = 20
min_positive_clusters = 10
min_positive_families = 3
max_single_binary_share = 0.50
max_single_cluster_share = 0.50
min_holdout_positive_binaries = 10
min_holdout_positive_clusters = 5

[pilot.sampling]
selection = "stage1"
clean_target = 200
max_per_cluster = 4

[pilot.mapping_gate]
min_observed_function_coverage = 0.95
min_target_match_coverage = 0.95
max_unresolved_target_matches = 0.02
manual_audit_functions = 40

[pilot.compute]
workers = 4
capa_timeout_seconds = 900
cfg_timeout_seconds = 1800
rss_limit_gb = 3.0
